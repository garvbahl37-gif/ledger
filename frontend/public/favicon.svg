<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    The mark is an L that is also a chart axis: one vertical stroke, one
    horizontal, meeting at the origin. It reads as the initial at large sizes
    and as a pair of axes at small ones, which suits a measurement instrument.

    Drawn from rectangles rather than a glyph so it stays crisp at 16px and
    needs no font, and with no filters, so it does not turn to mush when the
    browser scales it down for a tab.
  -->
  <rect width="32" height="32" rx="7" fill="#0b1220"/>
  <rect x="9" y="7" width="3.2" height="18" rx="1.2" fill="#2dd4bf"/>
  <rect x="9" y="21.8" width="14" height="3.2" rx="1.2" fill="#2dd4bf"/>
  <!-- Two entries above the axis: the record the ledger keeps. -->
  <rect x="15" y="16" width="8" height="2.4" rx="1.2" fill="#2dd4bf" opacity="0.55"/>
  <rect x="15" y="10.5" width="5" height="2.4" rx="1.2" fill="#2dd4bf" opacity="0.3"/>
</svg>
