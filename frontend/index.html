<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      SVG first for browsers that take it, .ico as the fallback everything else
      still asks for at the root, and a PNG for iOS which takes neither.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#080d18" />
    <meta name="description" content="Ledger seals its questions before running a single test, so it cannot quietly drop the ones it did not like the answer to. Measured on 510 tables with known ground truth." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ledger — the analyst that refuses to guess</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!--
      Space Grotesk for the interface, JetBrains Mono for data.

      Space Grotesk descends from Space Mono, so it sits naturally beside a
      monospace face, and its slightly drawn-with-a-compass letterforms suit an
      instrument. It holds up at the display sizes the hero uses without
      becoming decorative.

      The mono face is not a stylistic choice: p-values, effect sizes, hashes
      and generated code are the substance here. JetBrains Mono is loaded for
      its tabular figures and a zero that cannot be mistaken for an O.
    -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
